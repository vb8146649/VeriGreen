services:
  ollama:
    image: ollama/ollama:latest
    container_name: verigreen-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verigreen-api
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3:8b
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - DATABASE_URL=/app/data/verigreen.db
      - CHROMA_PATH=/app/data/chroma
      - DATA_DIR=/app/data
      - REPORT_DIR=/app/data/files/reports
      - BADGE_DIR=/app/data/files/badges
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: verigreen-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://localhost:8000
    restart: unless-stopped

volumes:
  ollama_data:
